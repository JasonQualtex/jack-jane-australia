<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Jack & Jane — Australia University Visit</title>
<style>
  :root{
    --ink:#16283D;
    --ink-soft:#4C5F73;
    --paper:#F3F5F7;
    --card:#FFFFFF;
    --line:#DFE4EA;
    --gold:#B8862E;
    --gold-soft:#F2E6D0;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; scroll-behavior:smooth;}
  body{padding-bottom:56px;}

  header.top{position:sticky; top:0; z-index:30; background:var(--ink); color:#fff; padding-top:env(safe-area-inset-top);}
  .top-inner{padding:14px 18px 12px; position:relative; min-height:130px; display:flex; align-items:center; gap:12px; box-sizing:border-box; overflow:visible;}
  .top-inner .text{max-width:68%;}
  .top-inner .brand{position:absolute; right:14px; bottom:12px; z-index:2;}
  .top-inner .brand img{height:100px; width:auto; display:block;}
  .top-inner h1{margin:0; font-size:19px; font-weight:650; letter-spacing:-0.01em;}
  .top-inner p{margin:2px 0 0; font-size:13px; color:#AFC0D1;}

  nav.tabs{display:flex; gap:0; overflow-x:auto; -webkit-overflow-scrolling:touch;
    border-top:1px solid rgba(255,255,255,0.12); scrollbar-width:none;}
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{flex:0 0 auto; appearance:none; border:none; background:none; color:#8FA0B0;
    font-family:var(--sans); font-size:12.5px; font-weight:600; letter-spacing:0.01em;
    padding:9px 12px 8px; white-space:nowrap; border-bottom:3px solid transparent;
    display:flex; flex-direction:column; align-items:center; gap:3px;}
  nav.tabs button svg{width:15px; height:15px; opacity:0.7;}
  nav.tabs button .d{display:block; font-family:var(--mono); font-size:14px; font-weight:600; color:#fff; line-height:1.1;}
  nav.tabs button.active{border-bottom:3px solid var(--tab-accent, var(--gold));}
  nav.tabs button.active svg{opacity:1; color:var(--tab-accent, var(--gold));}
  nav.tabs button.active .d{color:var(--tab-accent, var(--gold));}

  main{max-width:640px; margin:0 auto; padding:16px 14px 10px;}
  section.day{display:none;}
  section.day.active{display:block; animation:fade .18s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .hero{border-radius:16px; overflow:hidden; margin:2px 2px 14px; position:relative;
    background-size:cover; background-position:center; color:#fff; padding:26px 18px 20px; min-height:150px;
    display:flex; flex-direction:column; justify-content:flex-end;}
  .hero::before{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,18,28,0.22) 0%, rgba(10,18,28,0.30) 45%, rgba(10,18,28,0.82) 100%); z-index:0;}
  .hero-badge{width:30px; height:30px; border-radius:50%; background:var(--tab-accent,var(--gold)); display:flex;
    align-items:center; justify-content:center; margin-bottom:10px; position:relative; z-index:1;}
  .hero-badge svg{width:16px; height:16px; color:var(--ink);}
  .hero .weekday{font-family:var(--mono); font-size:12px; color:var(--tab-accent,var(--gold)); font-weight:600; letter-spacing:0.04em; position:relative; z-index:1;}
  .hero h2{margin:2px 0 0; font-size:21px; font-weight:650; letter-spacing:-0.01em; position:relative; z-index:1; text-shadow:0 1px 6px rgba(0,0,0,0.35);}

  .card{background:var(--card); border:1px solid var(--line); border-left:3px solid var(--accent,var(--line)); border-radius:14px; padding:16px; margin-bottom:12px;}
  .card h3{margin:0 0 10px; font-size:13px; font-weight:650; color:var(--ink-soft);}

  /* universal button style — anything tappable looks like this */
  .btn{
    display:inline-flex; align-items:center; gap:5px; font-family:var(--sans); font-size:12.5px; font-weight:650;
    color:var(--ink); text-decoration:none; background:#fff; border:1.4px solid var(--accent,var(--gold));
    border-radius:20px; padding:6px 12px; white-space:nowrap; line-height:1.2;
  }
  .btn:active{background:var(--accent-soft, var(--gold-soft));}
  .btn-block{display:inline-flex; margin:3px 6px 3px 0;}
  .btn-primary{background:var(--ink); color:#fff; border:none; padding:9px 16px; font-size:13.5px;}
  .btn-primary:active{background:#0E1C2C;}
  .btn-missing{
    display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:13px; font-weight:600;
    color:var(--ink-soft); background:#fff; border:1.4px dashed var(--line); border-radius:20px; padding:7px 13px;
  }

  .flight{border:1px dashed #C9B57A; border-radius:14px; background:linear-gradient(180deg,#FFFDF8,#FBF6EA);
    padding:14px 16px; margin-bottom:12px; position:relative;}
  .flight .row1{display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:10px;}
  .flight .field{display:flex; flex-direction:column; align-items:flex-start; gap:4px;}
  .flight .mini-label{font-family:var(--sans); font-weight:650; font-size:10px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft);}
  .flight .code-chip{
    display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-weight:700; font-size:14px;
    color:var(--ink); background:#fff; border:1.4px solid var(--gold); border-radius:16px; padding:6px 12px;
  }
  .flight .code-chip svg{width:13px; height:13px; flex-shrink:0; color:var(--gold);}
  .flight .code-chip.copied{background:#E3F3E4; border-color:#2E7D32; color:#1F5A22;}
  .flight .code-chip.copied svg{color:#2E7D32;}
  .flight .code{font-family:var(--mono); font-weight:700; font-size:15px; letter-spacing:0.02em;}
  .flight .ref{
    display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:15px; font-weight:700;
    color:var(--ink); background:var(--gold-soft); border:1.5px solid var(--gold); border-radius:20px;
    padding:8px 14px; letter-spacing:0.03em; min-height:38px;
  }
  .flight .ref svg{width:15px; height:15px; flex-shrink:0; color:var(--gold);}
  .flight .ref .cap{font-family:var(--sans); font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft); display:block; margin-top:1px;}
  .flight .ref .wrap{display:flex; flex-direction:column; align-items:flex-start; line-height:1.15;}
  .flight .ref.copied{background:#E3F3E4; border-color:#2E7D32; color:#1F5A22;}
  .flight .ref.copied svg{color:#2E7D32;}
  .hotel-ref{
    display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:14px; font-weight:700;
    color:var(--ink); background:var(--gold-soft); border:1.5px solid var(--gold); border-radius:20px;
    padding:7px 13px; letter-spacing:0.02em; min-height:36px; margin-top:10px;
  }
  .hotel-ref svg{width:14px; height:14px; flex-shrink:0; color:var(--gold);}
  .hotel-ref .cap{font-family:var(--sans); font-weight:600; font-size:10px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-soft); display:block; margin-top:1px;}
  .hotel-ref .wrap{display:flex; flex-direction:column; align-items:flex-start; line-height:1.15;}
  .hotel-ref.copied{background:#E3F3E4; border-color:#2E7D32; color:#1F5A22;}
  .hotel-ref.copied svg{color:#2E7D32;}
  .flight .route{display:flex; align-items:center; gap:10px; margin:12px 0 4px;}
  .flight .place{flex:1;}
  .flight .place .code2{font-family:var(--mono); font-size:26px; font-weight:700; line-height:1;}
  .flight .place .time{font-size:13px; color:var(--ink-soft); margin-top:2px;}
  .flight .arrow{color:var(--gold); font-size:18px;}
  .flight .meta{display:flex; gap:14px; margin-top:10px; font-size:12.5px; color:var(--ink-soft); flex-wrap:wrap;}
  .flight .links{display:flex; justify-content:space-between; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .flight .hint{font-size:11.5px; color:var(--ink-soft); margin-top:8px;}

  .transit{list-style:none; margin:0; padding:0;}
  .transit li{position:relative; padding:0 0 14px 22px; font-size:14.5px; line-height:1.5;}
  .transit li::before{content:""; position:absolute; left:5px; top:9px; width:7px; height:7px; border-radius:50%; background:var(--accent,var(--gold));}
  .transit li::after{content:""; position:absolute; left:8px; top:18px; bottom:0; width:1px; background:var(--line);}
  .transit li:last-child::after{display:none;}
  .transit li:last-child{padding-bottom:0;}
  .transit li .note{display:block; color:var(--ink-soft); font-size:13px; margin-top:4px;}
  .transit li .lbl{display:block; margin-bottom:4px;}

  .flag{background:var(--gold-soft); border-radius:10px; padding:10px 12px; font-size:13.5px; color:#6B4E1B; margin-bottom:12px; line-height:1.4;}

  .stay-name{font-weight:650; font-size:15px;}
  .stay-sub{font-size:13px; color:var(--ink-soft); margin-top:1px;}
  .stay-actions{display:flex; gap:0; flex-wrap:wrap; margin-top:12px;}

  ul.plain{margin:0; padding-left:0; list-style:none; font-size:14.5px; line-height:1.8;}
  ul.plain li{margin-bottom:8px;}
  ul.plain li .desc{color:var(--ink-soft); margin-left:2px;}

  .contact-card{font-size:14px; line-height:1.7;}
  .contact-card .role{color:var(--ink-soft); font-size:13px; margin-bottom:6px;}

  .row-card{border-top:1px solid var(--line); padding:12px 0; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;}
  .row-card:first-child{border-top:none; padding-top:0;}
  .row-card .rc-main{flex:1; min-width:170px;}
  .row-card .rc-label{font-family:var(--mono); font-size:11.5px; color:var(--ink-soft);}
  .row-card .rc-title{margin-top:4px;}
  .row-card .rc-sub{font-size:12.5px; color:var(--ink-soft); margin-top:3px;}

  ul.bulleted{margin:0; padding-left:20px; font-size:14.5px; line-height:1.7;}
  ul.bulleted li{margin-bottom:8px; padding-left:2px;}
  .row-card .hotel-ref{margin-top:0; flex-shrink:0;}

  details.conf{margin-top:8px;}
  details.conf summary{
    list-style:none; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
    font-size:12.5px; font-weight:650; color:var(--ink); background:#fff; border:1.4px solid var(--accent,var(--gold));
    border-radius:20px; padding:6px 12px;
  }
  details.conf summary::-webkit-details-marker{display:none;}
  details.conf[open] summary{background:var(--accent-soft,var(--gold-soft));}
  details.conf .conf-body{
    margin-top:10px; padding:14px; background:#FAFBFC; border:1px solid var(--line); border-radius:12px;
    font-size:13.5px; line-height:1.6;
  }
  details.conf .conf-body dl{margin:0; display:grid; grid-template-columns:auto 1fr; gap:6px 12px;}
  details.conf .conf-body dt{color:var(--ink-soft); font-weight:600; white-space:nowrap;}
  details.conf .conf-body dd{margin:0;}
  details.conf .conf-note{margin-top:10px; padding-top:10px; border-top:1px solid var(--line); color:var(--ink-soft); font-size:12.5px;}
  details.conf .msg{margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--line);}
  details.conf .msg:last-child{margin-bottom:0; padding-bottom:0; border-bottom:none;}
  details.conf .msg .who{font-weight:650; font-size:12.5px; color:var(--ink);}
  details.conf .msg .when{font-size:11px; color:var(--ink-soft); margin-left:6px;}
  details.conf .msg p{margin:4px 0 0; font-size:13.5px; line-height:1.55;}
  details.conf .open-item{background:var(--gold-soft); border-radius:8px; padding:8px 10px; font-size:12.5px; color:#6B4E1B; margin-top:10px;}

  .baggage-flag{font-size:12.5px; color:var(--ink-soft); text-align:center; margin:14px 0 0;}

  footer.jump{position:fixed; bottom:0; left:0; right:0; z-index:30; background:var(--card); border-top:1px solid var(--line);
    padding:8px 14px calc(8px + env(safe-area-inset-bottom)); display:flex; justify-content:space-between; align-items:center;}
  footer.jump button{appearance:none; border:none; background:var(--ink); color:#fff; font-family:var(--sans);
    font-weight:600; font-size:13.5px; padding:9px 16px; border-radius:20px;}
  footer.jump span{font-size:12px; color:var(--ink-soft);}

  /* Checklist: same cards and palette, with generous touch targets. */
  .check-item{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;min-width:0;transition:background .15s;}
  .check-item.is-done{background:#EAF5EE;border-color:#76A98A;}
  .check-label{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-size:14px;line-height:1.45;}
  .check-label input{width:24px;height:24px;flex:0 0 24px;accent-color:#24633D;cursor:pointer;}
  .check-title{flex:1;min-width:0;overflow-wrap:anywhere;}
  .check-state{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-top:3px;}
  .is-done .check-state{color:#205735;}
  .check-notes-label{display:block;font-size:12px;color:var(--ink-soft);margin:8px 0 5px;}
  .check-item textarea{display:block;width:100%;max-width:100%;min-height:72px;resize:vertical;border:1px solid #AAB7C4;border-radius:6px;padding:10px;background:#fff;color:var(--ink);font:16px/1.45 var(--sans);}
  .check-item input:focus-visible,.check-item textarea:focus-visible{outline:3px solid var(--gold);outline-offset:3px;}
  .check-help{font-size:13px;line-height:1.55;color:var(--ink-soft);}
  .deadline-list{padding-left:22px;margin:12px 0;}
  .deadline-list li{padding:10px 0;line-height:1.55;border-bottom:1px solid var(--line);font-size:14px;}
  .deadline-list time{display:block;font-weight:700;color:var(--ink);}
  #checklist .card p{line-height:1.55;}
  .check-acc{border:none;}
  .check-acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0 10px;font-weight:700;font-size:14.5px;color:var(--ink);min-height:44px;}
  .check-acc summary::-webkit-details-marker{display:none;}
  .check-acc summary::after{content:'▸';font-size:13px;color:var(--ink-soft);transition:transform .15s;flex:0 0 auto;}
  .check-acc[open] summary::after{transform:rotate(90deg);}
  .check-acc-title{flex:1;min-width:0;}
  .check-acc-status{font-size:11.5px;font-weight:700;color:#6B4E1B;white-space:nowrap;padding:4px 10px;border-radius:20px;background:linear-gradient(to right,#9FD9B4 var(--pct,0%),var(--gold-soft,#F1E7D2) var(--pct,0%));flex:0 0 auto;min-width:82px;text-align:center;transition:background .25s ease;}
  .check-acc-status.all-done{color:#205735;}
  .deadline-list li{border-bottom:1px solid var(--line);padding:0;}
  .deadline-list li:last-child{border-bottom:none;}
  .deadline-list li details{border:none;}
  .deadline-list li summary{list-style:none;cursor:pointer;display:flex;flex-wrap:nowrap;align-items:center;gap:10px;padding:10px 0;font-size:14px;}
  .deadline-list li summary::-webkit-details-marker{display:none;}
  .deadline-list li summary time.kd-date{display:inline-flex;flex-direction:column;align-items:stretch;width:42px;flex:0 0 auto;border-radius:8px;overflow:hidden;border:1px solid var(--line);box-shadow:0 1px 2px rgba(22,40,61,.10);}
  .deadline-list li summary time.kd-date .kd-mon{display:block;background:var(--ink);color:#fff;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;text-align:center;padding:3px 0;}
  .deadline-list li summary time.kd-date .kd-day{display:block;background:var(--card);color:var(--ink);font-size:19px;font-weight:800;text-align:center;line-height:1.25;padding:3px 0 4px;}
  .deadline-list li summary .kd-label{font-weight:600;color:var(--ink);flex:1 1 auto;min-width:0;}
  .deadline-list li summary::after{content:'▸';font-size:12px;font-weight:700;color:#fff;background:var(--ink);width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;transition:transform .15s;}
  .deadline-list li details[open] summary::after{transform:rotate(90deg);}
  .deadline-list li .kd-body{padding:0 0 12px 2px;}
  .deadline-list li .kd-body {margin:0;}
  .deadline-list li .kd-body p{margin:0;font-size:13.5px;line-height:1.55;color:var(--ink-soft);}
</style>
</head>

function checklistItem(id, title){
  return `<div class="check-item" data-check-id="${id}">
    <label class="check-label" for="check-${id}"><input id="check-${id}" type="checkbox"><span class="check-title">${title}<span class="check-state">To do</span></span></label>
    <label class="check-notes-label" for="notes-${id}">Notes — ${title}</label>
    <textarea id="notes-${id}" rows="2" placeholder="e.g. Jack applied 8 Sep"></textarea>
  </div>`;
}
function universityChecklist(id, title, help=''){
  const extra = id==='uq' ? checklistItem('uq-provider-contact','Accom providers contacted (before 25 Sep)') : '';
  return `<div class="card"><details class="check-acc" data-check-group="${id}">
    <summary><span class="check-acc-title">${title}</span><span class="check-acc-status">To do</span></summary>
    <div class="check-acc-body">
      ${help ? `<p class="check-help">${help}</p>` : ''}
      ${extra}
      ${CHECKLIST_TASKS.map(([key,label])=>checklistItem(id+'-'+key,label)).join('')}
    </div>
  </details></div>`;
}

// One stable key per task keeps notes and completion independent of page order.
function initChecklist(){
  const prefix = 'jack-jane-australia:checklist:v1:';
  const status = document.getElementById('checklist-save-status');
  const rows = new Map();
  function updateGroup(root){
    if(!root) return;
    const items = root.querySelectorAll('.check-item');
    const done = root.querySelectorAll('.check-item.is-done').length;
    const total = items.length;
    const badge = root.querySelector(':scope > summary .check-acc-status');
    if(!badge) return;
    const allDone = total>0 && done === total;
    badge.textContent = allDone ? '✓ All done' : `${done}/${total} done`;
    badge.classList.toggle('all-done', allDone);
    badge.style.setProperty('--pct', (total>0 ? Math.round(done/total*100) : 0) + '%');
  }
  function show(row, box){
    row.classList.toggle('is-done', box.checked);
    row.querySelector('.check-state').textContent = box.checked ? '✓ Done' : 'To do';
    updateGroup(row.closest('details.check-acc'));
  }
  function restore(row, raw){
    const box = row.querySelector('input');
    const notes = row.querySelector('textarea');
    try {
      const saved = JSON.parse(raw || 'null');
      box.checked = saved?.done === true;
      notes.value = typeof saved?.notes === 'string' ? saved.notes : '';
    } catch(e) { box.checked = false; notes.value = ''; }
    show(row, box);
  }
  document.querySelectorAll('#checklist .check-item').forEach(row=>{
    const key = prefix + row.dataset.checkId;
    const box = row.querySelector('input');
    const notes = row.querySelector('textarea');
    rows.set(key, row);
    try { restore(row, localStorage.getItem(key)); }
    catch(e) { status.textContent = 'Device storage is unavailable. Changes work here but will not survive closing or reloading this page.'; }
    const save = ()=>{
      show(row, box);
      try {
        localStorage.setItem(key, JSON.stringify({done:box.checked, notes:notes.value}));
        status.textContent = 'Saved on this device. Other devices do not sync.';
      } catch(e) {
        status.textContent = 'Could not save on this device. Keep this page open and copy any important notes before closing.';
      }
    };
    box.addEventListener('change', save);
    notes.addEventListener('input', save);
  });
  window.addEventListener('storage', event=>{
    if(event.key === null) rows.forEach(row=>restore(row, null));
    else if(rows.has(event.key)) restore(rows.get(event.key), event.newValue);
  });
}
initChecklist();

function goTo(i){
  current = Math.max(0, Math.min(DAYS.length-1, i));
  document.querySelectorAll('nav.tabs button').forEach((b,idx)=>b.classList.toggle('active', idx===current));
  document.querySelectorAll('section.day').forEach((s,idx)=>s.classList.toggle('active', idx===current));
  document.getElementById('pageLabel').textContent = `Page ${current+1} of ${DAYS.length}`;
  document.getElementById('prevBtn').style.visibility = current===0 ? 'hidden':'visible';
  document.getElementById('nextBtn').textContent = DAYS[current+1]?.id==='checklist' ? 'Checklist' : 'Next';
  document.getElementById('nextBtn').style.visibility = current===DAYS.length-1 ? 'hidden' : 'visible';
  const activeTab = tabsEl.children[current];
  if(activeTab && activeTab.scrollIntoView){ try{ activeTab.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'}); }catch(e){} }
  window.scrollTo(0,0);
}
document.getElementById('prevBtn').onclick = ()=>goTo(current-1);
document.getElementById('nextBtn').onclick = ()=>goTo(current===DAYS.length-1 ? DAYS.length-1 : current+1);

function legacyCopy(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly','');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch(e){ return false; }
}
function copyToClipboard(text){
  if (window.isSecureContext && navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(()=>true).catch(()=>legacyCopy(text));
  }
  return Promise.resolve(legacyCopy(text));
}
function copyRef(btn, ref){
  const original = btn.innerHTML;
  copyToClipboard(ref).then(ok=>{
    if(ok){
      btn.innerHTML = `${iconSvg('check',15)}<span class="wrap">Copied<span class="cap">on your clipboard</span></span>`;
      btn.classList.add('copied');
    } else {
      btn.innerHTML = `<span class="wrap">${ref}<span class="cap">Couldn't auto-copy — press and hold to copy</span></span>`;
    }
    setTimeout(()=>{btn.innerHTML = original; btn.classList.remove('copied');}, 2200);
  });
}

goTo(0);
